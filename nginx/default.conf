# =============================================================================
#  nginx/default.conf - FILE KHUNG: tự đổi PORT nếu cần (tránh trùng nhau)
# -----------------------------------------------------------------------------
#  - Mọi request GET /*  -> service "app" cổng 8080 (Spring Boot)
#    (ứng dụng chỉ trả dữ liệu JSON; truy cập "/" được chuyển tới /api/items)
#  Yêu cầu với docker-compose.yml:
#    + Service Spring Boot PHẢI tên là "app" và lắng nghe cổng 8080
#    + Mount file này (read-only) vào  /etc/nginx/conf.d/default.conf
#    + Cổng cá nhân APP_PORT trên server được publish ra cổng 80 của container
# =============================================================================

upstream spring_app {
    server app:8080;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Trang gốc -> danh sách hàng tồn kho dạng JSON
    location = / {
        return 302 /api/items;
    }

    # Reverse proxy toàn bộ request tới Spring Boot
    location / {
        proxy_pass         http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
